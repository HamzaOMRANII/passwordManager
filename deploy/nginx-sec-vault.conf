# SEC VAULT: Nginx server blocks.
# Paste ONE option inside the http { } block of /etc/nginx/nginx.conf (replacing the old
# "Password manager" server), then: sudo nginx -t && sudo systemctl reload nginx
#
# Express must listen on 127.0.0.1:11000 (HOST=127.0.0.1, the default), otherwise it
# collides with Nginx on port 11000.

## OPTION A: temporary, plain HTTP on the public IP.
## .env: NODE_ENV=production  APP_ORIGIN=http://37.60.240.195:11000
## WARNING: passwords and verification codes cross the internet unencrypted.
server {
    listen 37.60.240.195:11000;
    server_name _;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:11000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

## OPTION B: recommended, HTTPS on a (sub)domain whose DNS A record points to 37.60.240.195.
## 1. Use this block (port 80), reload Nginx.
## 2. sudo certbot --nginx -d vault.example.com   (certbot adds the 443/SSL part and the redirect)
## 3. .env: NODE_ENV=production  APP_ORIGIN=https://vault.example.com, then
##    pm2 reload ecosystem.prod.config.js --update-env
## 4. Remove OPTION A and close port 11000 in the firewall: sudo ufw delete allow 11000/tcp
